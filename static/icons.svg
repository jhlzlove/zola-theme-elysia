<!-- Elysia 图标库（SVG sprite）────────────────────────────────────
  维护说明：
  - 全站 UI 图标统一收敛在此文件，模板内不再写内联 <svg><path/></svg>。
  - 新增图标：追加一个 <symbol id="i-<name>" viewBox="..."> 即可，
    表现属性（fill / stroke / stroke-width）直接写在 <symbol> 上，
    内部个别图形需要覆盖时（如实心圆点）单独写属性。
  - 使用方式（见 templates/macros/icons.html）：
      {% import "macros/icons.html" as ic %}
      {{ ic::icon(name="search", class="search__icon") }}
  - 颜色继承 currentColor，尺寸由外层 <svg> 的 class / width / height
    及各组件 CSS 控制，sprite 本身不决定尺寸颜色。
  - 发版改动图标后，同步更新 macros/icons.html 中的 ?v= 版本号以破缓存。
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- 通用：菜单（抽屉按钮） -->
  <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M4 6h16M4 12h16M4 18h16"/>
  </symbol>
  <!-- 通用：搜索 -->
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
  </symbol>
  <!-- 社交：GitHub（实心） -->
  <symbol id="i-github" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.56 9.56 0 0 1 12 6.8a9.56 9.56 0 0 1 2.5.34c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.69-4.57 4.94.36.31.68.92.68 1.85v2.74c0 .26.18.58.69.48A10 10 0 0 0 12 2z"/>
  </symbol>
  <!-- 社交：RSS -->
  <symbol id="i-rss" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1" fill="currentColor" stroke="none"/>
  </symbol>
  <!-- 社交 / 简历：邮件 -->
  <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <rect x="2" y="5" width="20" height="14" rx="2"/><path d="m2 7 10 7 10-7"/>
  </symbol>
  <!-- 页脚：调色盘 -->
  <symbol id="i-palette" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3a9 9 0 0 0-9 9c0 3.8 2.3 7 5.6 8 0.7-.9 1.7-1.4 2.9-1.4s2.2.5 2.9 1.4c3.3-1 5.6-4.2 5.6-8a9 9 0 0 0-9-9z"/><circle cx="8.8" cy="8.6" r="1.2"/><circle cx="12" cy="6.7" r="1"/><circle cx="15.2" cy="8.6" r="1.2"/><circle cx="16" cy="11.6" r="0.9"/><circle cx="12" cy="14.8" r="1.6"/>
  </symbol>
  <!-- 页脚：语言 / 地球 -->
  <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
  </symbol>
  <!-- 主题切换：太阳 / 月亮 / 显示器（id 由 JS 控制显隐，保留三者） -->
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
  </symbol>
  <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><path d="M8 21h8M12 17v4"/>
  </symbol>
  <!-- 备案：盾牌对勾（ICP） -->
  <symbol id="i-shield-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path d="M12 3 4.5 6v5.5c0 4.6 3.1 7.8 7.5 9.5 4.4-1.7 7.5-4.9 7.5-9.5V6L12 3Z"/><path d="m8.5 12 2.2 2.2 4.8-5"/>
  </symbol>
  <!-- 备案：盾牌文字（公网安备） -->
  <symbol id="i-shield-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path d="M12 3 4 6.5v5c0 4.3 3.2 7.7 8 9.5 4.8-1.8 8-5.2 8-9.5v-5L12 3Z"/><path d="M8 10h8M9 13h6M10 16h4"/>
  </symbol>
  <!-- 备案：萌 ICP -->
  <symbol id="i-moe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path d="M5 11.5C5 7.9 8.1 5 12 5s7 2.9 7 6.5V17a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-5.5Z"/><path d="M8.5 10h.01M15.5 10h.01M9 14c1.8 1.5 4.2 1.5 6 0M5 12H3.5M20.5 12H19M8 5 6.5 3.5M16 5l1.5-1.5"/>
  </symbol>
  <!-- 通用：上 / 下箭头（回顶 / 下拉） -->
  <symbol id="i-chevron-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M18 15l-6-6-6 6"/>
  </symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M6 9l6 6 6-6"/>
  </symbol>
  <!-- 文章：置顶星标 -->
  <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M12 2l2.4 7.2H22l-6.2 4.5 2.4 7.3L12 17l-6.2 4 2.4-7.3L2 9.2h7.6z"/>
  </symbol>
  <!-- 文章：加密锁 -->
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
  </symbol>
  <!-- 文章：日期时钟 -->
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
  </symbol>
  <!-- 文章：阅读时长（笔） -->
  <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
  </symbol>
  <!-- 提示：感叹号（文章过期提醒） -->
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="12" cy="12" r="10"/><path d="M12 8v5"/><path d="M12 16h.01"/>
  </symbol>
  <!-- 目录：列表（TOC 标题） -->
  <symbol id="i-toc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M4 6h16M4 12h16M4 18h7"/>
  </symbol>
  <!-- 简历：电话 -->
  <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 5 12.07 19.79 19.79 0 0 1 1.93 3.44 2 2 0 0 1 3.91 1h3a2 2 0 0 1 2 1.72c.12 1.2.45 2.36.97 3.44a2 2 0 0 1-.57 2.12l-1.27 1.27a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.12-.57c1.08.52 2.24.85 3.44.97A2 2 0 0 1 22 14.92z"/>
  </symbol>
  <!-- 简历：定位 -->
  <symbol id="i-location" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M12 21s7-6.5 7-11a7 7 0 1 0-14 0c0 4.5 7 11 7 11z"/><circle cx="12" cy="10" r="3"/>
  </symbol>
  <!-- 组件：note 提示块图标（描边，24 栅格，与 GitHub Alerts 同形） -->
  <symbol id="i-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
  </symbol>
  <symbol id="i-tip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>
  </symbol>
  <symbol id="i-important" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
  </symbol>
  <symbol id="i-warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>
  </symbol>
  <symbol id="i-caution" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>
  </symbol>
  <!-- 组件：音频播放 / 暂停（实心图形） -->
  <symbol id="i-play" viewBox="0 0 24 24" fill="none">
    <polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/>
  </symbol>
  <symbol id="i-pause" viewBox="0 0 24 24" fill="none">
    <rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/>
  </symbol>
  <!-- 分类：文件夹 / 文件 -->
  <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M3 7l3 3"/>
  </symbol>
  <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M10 13H8"/><path d="M16 17H8"/><path d="M13 13h1"/>
  </symbol>
  <!-- 代码块：复制 / 已复制（由 JS 动态插入，见 static/js/main.js） -->
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v3"/>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M20 6L9 17l-5-5"/>
  </symbol>
  <!-- 许可：CC BY-NC-SA 徽标组（文章许可卡片右侧，见 templates/partials/license.html） -->
  <symbol id="i-cc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <circle cx="12" cy="12" r="9"/><text x="12" y="14.7" text-anchor="middle" font-size="7" font-weight="700" fill="currentColor" stroke="none" font-family="Inter,system-ui,sans-serif">CC</text>
  </symbol>
  <symbol id="i-by" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <circle cx="12" cy="12" r="9"/><text x="12" y="14.7" text-anchor="middle" font-size="7" font-weight="700" fill="currentColor" stroke="none" font-family="Inter,system-ui,sans-serif">BY</text>
  </symbol>
  <symbol id="i-nc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <circle cx="12" cy="12" r="9"/><text x="12" y="14.7" text-anchor="middle" font-size="7" font-weight="700" fill="currentColor" stroke="none" font-family="Inter,system-ui,sans-serif">NC</text>
  </symbol>
  <symbol id="i-sa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <circle cx="12" cy="12" r="9"/><text x="12" y="14.7" text-anchor="middle" font-size="7" font-weight="700" fill="currentColor" stroke="none" font-family="Inter,system-ui,sans-serif">SA</text>
  </symbol>
</svg>
