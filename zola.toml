# Zola configuration — Elysia Theme (modern minimalist)
base_url = "https://blog.elysiamoon.com/zola-theme-elysia/"
author="Elysia"
title = "诗酒趁年华"
description = "A modern, minimalist Zola theme — Reading is enjoyment."
default_language = "zh"
compile_sass = false
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]
minify_html = false

taxonomies = [
    {name = "categories", feed = true, paginate_by = 12, paginate_path = "page"},
    {name = "tags", feed = true, paginate_by = 12, paginate_path = "page"},
]

[markdown]
render_emoji = true
github_alerts = true
bottom_footnotes = true

[markdown.highlighting]
light_theme = "ayu-light"
dark_theme = "ayu-dark"
style = "class"

[slugify]
paths = "on"
taxonomies = "off"
anchors = "on"

[extra]
# ── Site Identity ──
avatar = "/avatar.jpg"
avatar_alt = "Elysia"
site_motto = "不修来世不修仙 且留大道在人间"

# ── Top Navigation Buttons (wrap automatically, 4 per row on desktop) ──
# icon is optional, can be emoji / svg name / url
# 菜单名称双模式（与 [extra.features].i18n 开关正交，均可用）：
# - name = "博客"：直接显示，零 translations 维护成本；
# - name_key = "menu_blog"：经 trans(key, lang=cur_lang) 翻译，需在 [translations] 与各 [languages.<code>.translations] 中定义；
# - 两者都写时 name 优先。
# - URL 保持与语言无关的形式（如 "/"、"/wiki/"），模板按 cur_lang 自动加前缀
[[extra.menus]]
name_key = "menu_blog"
url = "/"
icon = "✍️"

[[extra.menus]]
name_key = "menu_wiki"
url = "/wiki/"
icon = "📚"

[[extra.menus]]
name_key = "menu_archive"
url = "/archive/"
icon = "🗂️"

[[extra.menus]]
name_key = "menu_categories"
url = "/categories/"
icon = "📁"

[[extra.menus]]
name_key = "menu_tags"
url = "/tags/"
icon = "🏷️"

[[extra.menus]]
name_key = "menu_heatmap"
url = "/heatmap/"
icon = "🔥"

[[extra.menus]]
name_key = "menu_resume"
url = "/resume/"
icon = "📄"

[[extra.menus]]
name_key = "menu_friends"
url = "/friends/"
icon = "👥"

[[extra.menus]]
name_key = "menu_links"
url = "/links/"
icon = "🔗"

# ── Social Icons (bottom) ──
[[extra.socials]]
name = "GitHub"
url = "https://github.com"
icon = "github"

[[extra.socials]]
name = "RSS"
url = "/atom.xml"
icon = "rss"

[[extra.socials]]
name = "Email"
url = "mailto:hello@example.com"
icon = "mail"

# Footer (markdown supported, empty text hides the footer line)
# icp / police / moe 留空则不显示对应备案项
[extra.footer]
icp = ""
police = ""
moe = "20268080"
text = """
<span id="jinrishici-sentence"></span> <script src="https://sdk.jinrishici.com/v2/browser/jinrishici.js" charset="utf-8"></script>

© 2026 主题 [Elysia](https://github.com/jhlzlove/zola-theme-elysia) · 由 [Zola](https://www.getzola.org) 驱动
"""

# ── Inject head — arbitrary <link> etc. ──
# Example: { rel = "stylesheet", href = "https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-web/style.css" }
[extra.inject]
head = [
  { rel = "stylesheet", href = "https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-web/style.css" },
  { rel = "stylesheet", href = "https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" },
  { rel = "stylesheet", href = "https://fontsapi.zeoseven.com/442/main/result.css" },
]

# ── Style / Palette / Fonts ──
# palette: "default" | "lime" | "orange" | "violet"
# font_base_size: 全站基准字号（html rem 锚点；除正文/代码/简历外的 UI 文字都以此缩放）
# font_body_size: 文章正文；font_code_size: 代码块；font_*_family 为完整字体栈
[extra.style]
default_palette = "default"
font_base_size = "16px"
font_body_size = "1rem"
font_code_size = "0.875rem"
font_body_family = [ "Maple Mono NF CN", "Inter", "system-ui", "-apple-system", "Segoe UI", "Roboto", "Helvetica", "Arial", "sans-serif"]
font_code_family = ["JetBrains Mono", "Maple Mono NF CN", "ui-monospace", "SFMono-Regular", "Menlo", "Monaco", "Consolas", "monospace"]

# ── Comments ──
# enable 总开关；provider: "giscus" | "artalk" | "waline" | "none"
# provider 为空时按 giscus → artalk → waline 是否填有服务地址自动推断
[extra.comments]
enable = false
provider = "giscus"   # e.g. "artalk"
comment_title = "欢迎评论 — 留下你的想法"

# ── Giscus ──
[extra.comments.giscus]
repo = "user/repo"
repo_id = "repo_id"
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
theme = "preferred_color_scheme"
lang = "zh-CN"

# ── Artalk ── https://artalk.js.org
[extra.comments.artalk]
server = ""          # e.g. "https://artalk.example.com"
site = ""            # site name, optional
placeholder = ""     # placeholder text
no_comment = ""      # text when no comments
page_key = ""        # leave empty to use pathname
gravatar_mirror = ""
avatar_mirror = ""

# ── Waline ── https://waline.js.org
[extra.comments.waline]
serverURL = ""       # e.g. "https://waline.example.com"
lang = "zh-CN"
dark = "auto"        # "auto" | css selector
emoji = ["https://unpkg.com/@waline/emojis@1.1.0/bilibili"]
meta = ["nick", "mail", "link"]
requiredMeta = ["nick", "mail"]
login = "false"
placeholder = ""

# ── Search ──
# provider: "pagefind"（默认，本地索引）| "algolia" | "none"
# pagefind：构建后运行 ./pagefind_extended --site public 生成 public/pagefind/ 索引，无需任何 key（中文站必须用 extended，普通版 pagefind 不含中文分词）
# pagefind_path：bundle 输出目录（`pagefind_extended --site public` 的位置），站内相对路径
# algolia：见下方 [extra.search.algolia]（需 app_id + api_key + index_name）
# placeholder：搜索框提示文案的翻译 key（见 [translations] search_placeholder），自定义 key 必须在各语言 translations 中定义，否则构建会报错（与菜单 name_key 规则一致）
[extra.search]
enable = true
provider = "pagefind"
hits_per_page = 8
placeholder = "search_placeholder"
pagefind_path = "pagefind/"

# ── Algolia Search ── Get from https://dashboard.algolia.com
[extra.search.algolia]
app_id = ""          # e.g. "LATENCY"
api_key = ""         # search-only API key
index_name = ""      # e.g. "elysia"
show_powered_by = true

# ── API Services — 外部接口（各服务独立子表，按需扩展）──
# sitemap：link 卡片元数据增强。访客打开页面时用卡片 href 请求 api，
# 成功则用返回的 title / desc / icon 覆盖卡片，失败则保留用户手写信息。
# api 中的 {href} 为占位符
# 设置 api 可以自动提取网页标题、图标，服务部署方法：https://github.com/xaoxuu/site-info-api/
# 接口测试通过后，把按钮的 href 部分替换成 {href} 之后填写到下方，例如：https://api.xaox.cc/site_info/v1?url={href}
[extra.api.sitemap]
enable = false
api = "https://melodious-lily-64ecd1.netlify.app/.netlify/functions/index?url={href}"

# ── Features ──
[extra.features]
# Show year progress bar
year_progress = true
# Enable TOC on pages
toc = true
# Show line numbers in code blocks (true by default)
code_line_numbers = true
# Show reading time
show_reading_time = true
# Show language switcher (default true; false hides it; menu name / name_key both work either way)
i18n = true
# ── Article Expiry — 文章过期提示 ──
# 在文章头部显示过期提醒：根据 date/updated 与当前时间计算，超过 expiry_days 天即显示
# 文案通过 Zola translations 管理：key 为 `article_expiry`，支持占位符 {date}（最后更新日期） {diff}（距今实际天数） {days}（阈值天数）
# 默认语言在 [translations] 中配置，其他语言在 [languages.<code>.translations] 中配置
expiry_enable = true
expiry_days = 90
# ── License — 文章许可声明（正文末）──
# 文案优先级：单篇 extra.license_text > 此处 license_text > translations 的 license_text；
# license_text 为 Markdown，支持占位符 {author} {title} {url}；
# 单篇以 extra.license = false 关闭；英文默认文案在 [languages.en.translations] 中
license_enable = true
# license_text = "本文作者：{author} · 许可协议 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) · 转载请注明出处 [原文链接]({url})"
# ── KaTeX ── 设 katex_enable = true 即启用 $...$ / $$...$$ 数学公式
katex_enable = true
# 可选：自定义 CDN，默认 jsDelivr 0.16.9
# katex_css_url = "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
# katex_js_url = "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
# katex_auto_render_url = "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"

# ── Translations — 默认语言 (zh) ──
# 增删菜单时：只需在 [[extra.menus]] 中改一套，同步在此与 [languages.en.translations] 中增删对应 key
[translations]
menu_blog = "博客"
menu_wiki = "Wiki"
menu_archive = "归档"
menu_categories = "分类"
menu_tags = "标签"
menu_heatmap = "热力图"
menu_resume = "简历"
menu_friends = "友链"
menu_links = "工具集"
article_expiry = "本文最后更新于 {date}，距今已有 {diff} 天（超过 {days} 天未更新），内容可能已过时，请注意甄别。"
toc_title = "目录"
toc_on_this_page = "本页目录"
search_placeholder = "搜索文章..."
license_text = """
本文作者：{author}

本文链接: {url}

许可协议: 本文遵循 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 转载请注明出处.
"""

[languages.en]
title = "Elysia EN"
description = "A modern minimalist Zola theme — Reading is enjoyment."
generate_feeds = true
taxonomies = [
    {name = "categories", feed = true},
    {name = "tags", feed = true},
]

[languages.en.translations]
menu_blog = "Blog"
menu_wiki = "Wiki"
menu_archive = "Archive"
menu_categories = "Categories"
menu_tags = "Tags"
menu_heatmap = "Heatmap"
menu_resume = "Resume"
menu_friends = "Friends"
menu_links = "Tools"
article_expiry = "This article was last updated on {date} ({diff} days ago, over the {days}-day threshold). The content may be outdated, please verify the information."
toc_title = "On this page"
toc_on_this_page = "On this page"
search_placeholder = "Search posts..."
license_text = "Author: {author} · Licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) · Please credit the [original article]({url}) when sharing"
