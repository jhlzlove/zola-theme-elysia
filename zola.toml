# Zola configuration — Elysia Theme (modern minimalist)
base_url = "https://blog.elysiamoon.com/zola-theme-elysia/"
# base_url = "http://localhost:1414"
author="Elysia"
title = "诗酒趁年华"
description = "A modern, minimalist Zola theme — Reading is enjoyment."
default_language = "zh"
compile_sass = false
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]
minify_html = false

taxonomies = [
    {name = "categories", feed = true, paginate_by = 12, paginate_path = "page"},
    {name = "tags", feed = true, paginate_by = 12, paginate_path = "page"},
]

[markdown]
render_emoji = true
github_alerts = true
bottom_footnotes = true

[markdown.highlighting]
theme = "catppuccin-mocha"
style = "class"

[extra]
# ── Site Identity ──
avatar = "/avatar.jpg"
avatar_alt = "Elysia"
site_motto = "不修来世不修仙 且留大道在人间"

# Footer (markdown supported)
# <span id="jinrishici-sentence"></span> <script src="https://sdk.jinrishici.com/v2/browser/jinrishici.js" charset="utf-8"></script>
footer = """
本博客所有文章除特别声明外，均采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。

© 2026 Elysia · 由 [Zola](https://www.getzola.org) 驱动 · 主题 [Elysia](https://github.com/jhlzlove/zola-theme-elysia)
"""

# ── Site filings / 备案信息（留空则不显示对应项目）──
# 支持 icp、公安、萌国备案号
[extra.filing]
icp = ""
police = ""
moe = "20268080"

# ── Top Navigation Buttons (wrap automatically, 4 per row on desktop) ──
# icon is optional, can be emoji / svg name / url
# 使用 Zola translations 实现多语言：仅需维护一套菜单，显示名称通过 translations 翻译
# - 默认语言文案在 [translations] 中定义
# - 其他语言在 [languages.<code>.translations] 中定义
# - 模板通过 trans(key=item.name_key, lang=cur_lang) 获取当前语言名称
# - URL 保持与语言无关的形式（如 "/"、"/wiki/"），模板按 cur_lang 自动加前缀
[[extra.menus]]
name_key = "menu_blog"
url = "/"
icon = "✍️"

[[extra.menus]]
name_key = "menu_wiki"
url = "/wiki/"
icon = "📚"

[[extra.menus]]
name_key = "menu_archive"
url = "/archive/"
icon = "🗂️"

[[extra.menus]]
name_key = "menu_categories"
url = "/categories/"
icon = "📁"

[[extra.menus]]
name_key = "menu_tags"
url = "/tags/"
icon = "🏷️"

[[extra.menus]]
name_key = "menu_heatmap"
url = "/heatmap/"
icon = "🔥"

[[extra.menus]]
name_key = "menu_resume"
url = "/resume/"
icon = "📄"

[[extra.menus]]
name_key = "menu_friends"
url = "/friends/"
icon = "🔗"

[[extra.menus]]
name_key = "menu_links"
url = "/links/"
icon = "🔗"

# ── Social Icons (bottom) ──
[[extra.socials]]
name = "GitHub"
url = "https://github.com"
icon = "github"

[[extra.socials]]
name = "RSS"
url = "/atom.xml"
icon = "rss"

[[extra.socials]]
name = "Email"
url = "mailto:hello@example.com"
icon = "mail"


# ── Inject head — arbitrary <link> etc. ──
# Example: { rel = "stylesheet", href = "https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-web/style.css" }
[extra.inject]
head = [
  { rel = "stylesheet", href = "https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-web/style.css" },
  { rel = "stylesheet", href = "https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" },
  { rel = "stylesheet", href = "https://fontsapi.zeoseven.com/442/main/result.css" },
]

# ── Style / Palette defaults ──
# theme: "auto" | "light" | "dark"
[extra.style]
default_theme = "auto"
# palette: "default" | "lime" | "orange" | "violet"
default_palette = "default"

# ── Fonts ──
# root_size: global html font-size; body_size: article/body; code_block_size: code
# body_family / code_block_family: full font stack as array (include defaults so source stays simple)
[extra.style.fonts]
root_size = "16px"
body_size = "16px"
code_block_size = "14px"
body_family = ["LXGW WenKai Screen", "Inter", "system-ui", "-apple-system", "Segoe UI", "Roboto", "Helvetica", "Arial", "sans-serif"]
code_block_family = ["JetBrains Mono", "ui-monospace", "SFMono-Regular", "Menlo", "Monaco", "Consolas", "monospace"]

# ── Comments ──
# enable 在 [extra.comments] 统一控制；各系统不再单独设 enable
# provider: "giscus" | "artalk" | "waline" | "none"
[extra.comments]
enable = false
provider = "giscus"   # e.g. "artalk"
comment_title = "欢迎评论 — 留下你的想法"

# ── Giscus ──
[extra.giscus]
repo = "user/repo"
repo_id = "repo_id"
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
theme = "preferred_color_scheme"
lang = "zh-CN"
loading = "lazy"

# ── Artalk ── https://artalk.js.org
[extra.artalk]
server = ""          # e.g. "https://artalk.example.com"
site = ""            # site name, optional
placeholder = ""     # placeholder text
no_comment = ""      # text when no comments
emit_own = false
page_key = ""        # leave empty to use pathname
gravatar_mirror = ""
avatar_mirror = ""

# ── Waline ── https://waline.js.org
[extra.waline]
serverURL = ""       # e.g. "https://waline.example.com"
lang = "zh-CN"
dark = "auto"        # "auto" | css selector
emoji = ["https://unpkg.com/@waline/emojis@1.1.0/bilibili"]
meta = ["nick", "mail", "link"]
requiredMeta = ["nick", "mail"]
login = "false"
placeholder = ""

# ── Search ──
# provider: "pagefind"（默认，本地索引）| "algolia" | "none"
# pagefind：构建后运行 ./pagefind --site public 生成 public/pagefind/ 索引，无需任何 key
# algolia：沿用下方 [extra.algolia] 配置（需 app_id + api_key + index_name）
# placeholder：搜索框提示文案的翻译 key（见 [translations] search_placeholder），自定义 key 必须在各语言 translations 中定义，否则构建会报错（与菜单 name_key 规则一致）
[extra.search]
enable = true
provider = "pagefind"
hits_per_page = 8
placeholder = "search_placeholder"

# ── Pagefind Search（本地索引）──
# bundle 输出目录（`pagefind --site public` 的位置），站内相对路径；默认 "pagefind/"
[extra.pagefind]
path = "pagefind/"

# ── Algolia Search ──
[extra.algolia]
# Get from https://dashboard.algolia.com
app_id = ""          # e.g. "LATENCY"
api_key = ""         # search-only API key
index_name = ""      # e.g. "elysia"
show_powered_by = true
# Optional: customize hits display (title, url, summary, content)
# attribute_for_highlight = ["title", "content"]

# ── Features ──
[extra.features]
# Show year progress bar
year_progress = true
# Enable TOC on pages
toc = true
# Show line numbers in code blocks (true by default)
code_line_numbers = true
# Articles per page
paginate_by = 5
# Show reading time
show_reading_time = true


# ── Article Expiry Warning — 文章过期提示 ──
# 在文章头部显示过期提醒：根据 date/updated 与当前时间计算，超过 days 天即显示
# 文案通过 Zola translations 管理：key 为 `article_expiry`，支持占位符 {days} {date} {diff}
# 默认语言在 [translations] 中配置，其他语言在 [languages.<code>.translations] 中配置
[extra.article_expiry]
enable = true
days = 90

# ── KaTeX ── 设 enable = true 即启用 $...$ / $$...$$ 数学公式
[extra.katex]
enable = true
# 可选：自定义 CDN，默认 jsDelivr 0.16.9
# css_url = "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
# js_url = "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
# auto_render_url = "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"

# ── Translations — 默认语言 (zh) ──
# 增删菜单时：只需在 [[extra.menus]] 中改一套，同步在此与 [languages.en.translations] 中增删对应 key
[translations]
menu_blog = "博客"
menu_wiki = "Wiki"
menu_archive = "归档"
menu_categories = "分类"
menu_tags = "标签"
menu_heatmap = "热力图"
menu_resume = "简历"
menu_friends = "友链"
menu_links = "工具集"
article_expiry = "本文最后更新于 {date}，已超过 {days} 天未更新，内容可能已过时，请注意甄别。"
toc_title = "目录"
toc_on_this_page = "本页目录"
search_placeholder = "搜索文章..."

[languages.en]
title = "Elysia EN"
description = "A modern minimalist Zola theme — Reading is enjoyment."
generate_feeds = true
taxonomies = [
    {name = "categories", feed = true},
    {name = "tags", feed = true},
]

[languages.en.translations]
menu_blog = "Blog"
menu_wiki = "Wiki"
menu_archive = "Archive"
menu_categories = "Categories"
menu_tags = "Tags"
menu_heatmap = "Heatmap"
menu_resume = "Resume"
menu_friends = "Friends"
menu_links = "Tools"
article_expiry = "This article was last updated on {date} and has not been updated for over {days} days. The content may be outdated, please verify the information."
toc_title = "On this page"
toc_on_this_page = "On this page"
search_placeholder = "Search posts..."

[slugify]
paths = "on"
taxonomies = "off"
anchors = "on"
